name: Release

# Push a tag v<version> (matching package.json) to build the VPM zip and create the GitHub release.
# The "Listing" workflow then rebuilds the VPM listing on the vpm branch.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          VERSION=$(jq -r .version package.json)
          NAME=$(jq -r .name package.json)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Build package zip
        run: |
          mkdir -p dist
          zip -r -X "dist/$NAME-$VERSION.zip" \
            package.json package.json.meta README.md README.md.meta CHANGELOG.md CHANGELOG.md.meta \
            LICENSE LICENSE.meta Editor Editor.meta 'Server~'
          cp package.json dist/package.json
          unzip -l "dist/$NAME-$VERSION.zip"

      - name: Release notes
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $VERSION" > dist/notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/$NAME-$VERSION.zip" dist/package.json \
            --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
